<title>Grupos de Matemática</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #161616;
        text-align: center;
        color: white;
        margin: 0;
        padding: 20px;
    }

    h1 {
        margin-bottom: 30px;
    }

    .botoes {
        margin-bottom: 30px;
    }

    button {
        background-color: white;
        color: #333;
        border: none;
        padding: 15px 25px;
        margin: 10px;
        font-size: 16px;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background-color: #f8f9fc;
        transform: scale(1.05);
    }

    .info {
        background-color: rgba(255,255,255,0.9);
        color: black;
        padding: 20px;
        border-radius: 15px;
        width: 60%;
        margin: auto;
        display: none;
    }
</style>
